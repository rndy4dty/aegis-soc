target-version = "py312"
line-length = 88

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "output",
    "_draft",
]

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[lint.per-file-ignores]
"tests/**/*.py" = ["B011", "F401", "F841"]
"api/**/*.py" = ["B008"]

[lint.isort]
known-first-party = ["pkg", "internal", "api", "cli"]
