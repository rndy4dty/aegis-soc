services:
  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  aegis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aegis-soc:latest
    container_name: aegis-soc
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AEGIS_DATABASE_URL: postgresql+psycopg://aegis:aegis@postgres:5432/aegis
    volumes:
      - ../examples:/data:ro
      - ../output:/output
    working_dir: /app
    restart: "no"
    command: ["--help"]

volumes:
  postgres_data:
